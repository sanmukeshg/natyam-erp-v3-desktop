<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Natyam ERP v3 — Admin</title>
    <meta name="description" content="Natyam ERP v3 — desktop admin app for NATYAM, School of Kuchipudi.">

    <!-- terracotta-700, the darkest step still legible behind white chrome text.
         Was #2f2a6b — a purple this app uses nowhere: its accent has been
         --brand-terracotta-500 throughout. The old value survived only here,
         in the manifest, and in printed report headers. -->
    <meta name="theme-color" content="#813724" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14141c" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">

    <link rel="manifest" href="manifest.json">
    <!--
      A raster favicon, not the SVG that used to be here. The SVG was a purple
      ghungroo placeholder, and because the manifest listed it first with
      sizes="any" some launchers picked it over the real icons — so replacing
      the artwork alone would have left those still showing the placeholder.
      Kept identical to natyam-mobile so both apps present one mark.
    -->
    <link rel="icon" href="assets/icons/icon-48.png" sizes="48x48" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/v3.css">

    <!--
      tokens.css still supplies the shared type scale, spacing grid, radii,
      motion and z-index; v3.css adds the v3 glass-on-artwork design layer
      the interior screens are built from (see its own header). components.css
      is deliberately not loaded — no migrated screen needs v2's opaque-surface
      component styles yet; it comes in with the first module that does.

      The inline script below paints the stored theme before the stylesheets
      and JS finish loading: without it the app paints light, then repaints
      dark a moment later, which looks broken on every reload in dark mode.
    -->
    <script>
        (function () {
            try {
                var stored = JSON.parse(localStorage.getItem('natyam.session') || '{}');
                var prefs = stored.prefs || {};
                var theme = prefs.theme || 'light';
                if (theme === 'system') {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = theme;
                document.documentElement.dataset.density = prefs.density || 'comfortable';
            } catch (e) { /* defaults in the markup are already correct */ }
        })();
    </script>
</head>
<body>
    <div id="app"></div>

    <div id="boot" class="boot-screen" role="status" aria-live="polite">
        <div class="boot-mark"><img src="assets/img/brand/medallion.jpg" alt="Natyam ERP"></div>
        <div class="boot-name">Natyam ERP v3</div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-msg"><span>Preparing admin app…</span></div>
    </div>

    <noscript>
        <div class="fatal">
            <h1>JavaScript is required</h1>
            <p>Natyam ERP needs JavaScript enabled to run. Please enable it and reload the page.</p>
        </div>
    </noscript>

    <script type="module" src="js/app.js"></script>
</body>
</html>
